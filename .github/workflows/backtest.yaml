name: Continuous Deployment & Backtest Execution

on:
  push:
    branches:
      - main

jobs:
  execute-and-track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools
          pip-sync requirements.txt

      - name: Execute Backtest & Train Strategy
        env:
          # SET URI HERE!!!!
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db 
        run: |
          # Ensure the models directory exists as required
          mkdir -p models/
          
          # Execute the main engine. 
          # (src/main.py should contain the logic to save the final model to models/)
          python -m src.main

      - name: Archive Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-market-making-models
          path: models/
          retention-days: 30

      - name: Archive MLflow Tracking Data (Optional but recommended)
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-experiment-tracking
          path: |
            mlruns/
            mlflow.db
          retention-days: 30
